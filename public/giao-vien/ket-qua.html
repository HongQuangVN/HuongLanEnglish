<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kết quả bài làm — Phiếu bài tập</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<style>
  :root{
    --pink:#ec4899;
    --pink-light:#fce7f3;
    --pink-deep:#db2777;
    --violet:#7c3aed;
    --violet-light:#ede9fe;
    --blue:#3b82f6;
    --blue-light:#eff6ff;
    --ink:#171826;
    --ink-soft:#3f4152;
    --gray:#6b7280;
    --gray-soft:#9ca3af;
    --green:#10b981;
    --green-light:#d1fae5;
    --amber:#f59e0b;
    --amber-light:#fef3c7;
    --red:#ef4444;
    --red-light:#fee2e2;
    --border:#eef0f4;
    --card-bg:#ffffff;
    --canvas:#f7f7fb;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:'Inter','Segoe UI','Helvetica Neue',Arial,sans-serif;
    background:var(--canvas);
    color:var(--ink);
    line-height:1.55;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:1080px;margin:0 auto;padding:28px 20px 90px;}
  a{color:inherit;}

  /* ===== HEADER ===== */
  .header{
    background:linear-gradient(135deg,#171826 0%,#312450 55%,#5b2a86 100%);
    border-radius:28px;
    padding:36px 32px;
    color:white;
    position:relative;
    overflow:hidden;
    margin-bottom:22px;
    box-shadow:0 16px 40px rgba(23,24,38,0.25);
  }
  .header::before{
    content:"";
    position:absolute;
    right:-60px; top:-80px;
    width:280px;height:280px;
    background:radial-gradient(circle,rgba(236,72,153,0.35),transparent 70%);
    border-radius:50%;
  }
  .header::after{
    content:"";
    position:absolute;
    left:-40px; bottom:-90px;
    width:220px;height:220px;
    background:radial-gradient(circle,rgba(59,130,246,0.25),transparent 70%);
    border-radius:50%;
  }
  .header-inner{position:relative;z-index:1;}
  .header-top-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
    margin-bottom:16px;
  }
  .header-top-row .badge{margin-bottom:0;}
  .header-logout-btn{
    background:rgba(255,255,255,0.12);
    border:1px solid rgba(255,255,255,0.25);
    color:white;
    box-shadow:none;
  }
  .header-logout-btn:hover{background:rgba(255,255,255,0.2);box-shadow:none;}
  .badge{
    display:inline-flex;
    align-items:center;
    gap:6px;
    background:rgba(255,255,255,0.12);
    border:1px solid rgba(255,255,255,0.2);
    backdrop-filter:blur(6px);
    color:white;
    padding:6px 14px;
    border-radius:20px;
    font-size:12.5px;
    font-weight:700;
    letter-spacing:0.5px;
    margin-bottom:16px;
  }
  .header h1{margin:0 0 8px;font-size:28px;font-weight:800;letter-spacing:-0.02em;}
  .header p{margin:0;font-size:14.5px;opacity:0.75;max-width:600px;}

  /* ===== BUTTONS ===== */
  .btn{
    display:inline-flex;
    align-items:center;
    gap:7px;
    background:linear-gradient(135deg,var(--pink),var(--violet));
    color:white;
    border:none;
    padding:11px 22px;
    border-radius:14px;
    font-size:13.5px;
    font-weight:700;
    font-family:inherit;
    cursor:pointer;
    transition:transform .15s ease, box-shadow .15s ease, opacity .15s ease;
    box-shadow:0 6px 18px rgba(124,58,237,0.28);
    white-space:nowrap;
  }
  .btn:hover{transform:translateY(-1px);box-shadow:0 8px 22px rgba(124,58,237,0.35);}
  .btn:active{transform:translateY(0);}
  .btn:disabled{opacity:0.55;cursor:not-allowed;transform:none;}
  .btn.ghost{
    background:white;
    color:var(--ink-soft);
    border:1.5px solid var(--border);
    box-shadow:none;
  }
  .btn.ghost:hover{border-color:var(--gray-soft);box-shadow:none;}
  .btn.sm{padding:8px 16px;font-size:12.5px;border-radius:11px;}

  /* ===== GATE (Đăng nhập Supabase) ===== */
  .gate-overlay{
    position:fixed;inset:0;
    background:
      radial-gradient(circle at 15% 20%, rgba(236,72,153,0.15), transparent 45%),
      radial-gradient(circle at 85% 80%, rgba(124,58,237,0.15), transparent 45%),
      var(--canvas);
    display:flex;align-items:center;justify-content:center;
    z-index:500;
    padding:20px;
  }
  .gate-card{
    background:var(--card-bg);
    border-radius:26px;
    padding:42px 34px;
    max-width:380px;
    width:100%;
    text-align:center;
    box-shadow:0 24px 60px rgba(23,24,38,0.12);
    border:1px solid var(--border);
  }
  .gate-icon{
    width:56px;height:56px;
    margin:0 auto 16px;
    border-radius:16px;
    background:linear-gradient(135deg,var(--pink),var(--violet));
    display:flex;align-items:center;justify-content:center;
    font-size:26px;
    box-shadow:0 8px 20px rgba(124,58,237,0.3);
  }
  .gate-card h2{margin:0 0 6px;font-size:20px;font-weight:800;}
  .gate-card p{margin:0 0 22px;font-size:13.5px;color:var(--gray);}
  .gate-card input{
    width:100%;
    border:1.5px solid var(--border);
    background:var(--canvas);
    border-radius:13px;
    padding:13px 16px;
    font-size:14.5px;
    font-family:inherit;
    outline:none;
    margin-bottom:12px;
    text-align:center;
    transition:border-color .15s ease, background .15s ease;
  }
  .gate-card input:focus{border-color:var(--pink);background:white;}
  .gate-card .btn{width:100%;justify-content:center;margin-top:6px;}
  .gate-error{
    margin-top:14px;
    background:var(--red-light);
    color:#b91c1c;
    padding:10px 14px;
    border-radius:12px;
    font-size:12.5px;
    font-weight:700;
  }

  /* ===== STATS ===== */
  .stats-row{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:14px;
    margin-bottom:22px;
  }
  .stat-card{
    background:var(--card-bg);
    border-radius:20px;
    padding:20px 18px;
    box-shadow:0 4px 16px rgba(23,24,38,0.05);
    border:1px solid var(--border);
    position:relative;
    overflow:hidden;
  }
  .stat-card .stat-icon{
    width:34px;height:34px;
    border-radius:10px;
    display:flex;align-items:center;justify-content:center;
    font-size:16px;
    margin-bottom:10px;
  }
  .stat-card:nth-child(1) .stat-icon{background:var(--blue-light);}
  .stat-card:nth-child(2) .stat-icon{background:var(--violet-light);}
  .stat-card:nth-child(3) .stat-icon{background:var(--amber-light);}
  .stat-card:nth-child(4) .stat-icon{background:var(--green-light);}
  .stat-num{font-size:25px;font-weight:800;color:var(--ink);letter-spacing:-0.02em;}
  .stat-label{font-size:12px;color:var(--gray);margin-top:3px;font-weight:600;}

  /* ===== TOOLBAR ===== */
  .toolbar{
    display:flex;
    gap:10px;
    margin-bottom:14px;
    flex-wrap:wrap;
    align-items:center;
  }
  .search-field{
    position:relative;
    flex:1 1 240px;
    min-width:0;
  }
  .toolbar input[type="text"]{
    width:100%;
    border:1.5px solid var(--border);
    background:var(--card-bg);
    border-radius:14px;
    padding:12px 16px;
    font-size:14px;
    font-family:inherit;
    outline:none;
    transition:border-color .15s ease, box-shadow .15s ease;
  }
  .toolbar input[type="text"]:focus{border-color:var(--pink);box-shadow:0 0 0 3px rgba(236,72,153,0.12);}
  .toolbar select{
    border:1.5px solid var(--border);
    background:var(--card-bg);
    border-radius:14px;
    padding:12px 16px;
    font-size:14px;
    font-family:inherit;
    color:var(--ink-soft);
    outline:none;
    cursor:pointer;
  }
  .select-row{display:flex;gap:10px;}
  .toolbar-actions{display:flex;gap:10px;}
  .last-updated{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
    font-size:12px;
    color:var(--gray-soft);
    margin-bottom:18px;
  }
  .refresh-link{
    font-size:12.5px;
    font-weight:700;
    color:var(--pink-deep);
    text-decoration:none;
    white-space:nowrap;
  }
  .refresh-link:hover{text-decoration:underline;}

  /* ===== KEBAB MENU (⋮) ===== */
  .sc-kebab-wrap{position:relative;flex-shrink:0;}
  .kebab-btn{
    width:34px;height:34px;
    border-radius:10px;
    border:1.5px solid transparent;
    background:transparent;
    color:var(--gray-soft);
    font-size:18px;
    font-weight:800;
    cursor:pointer;
    display:flex;align-items:center;justify-content:center;
    line-height:1;
    opacity:0.5;
    transition:background .15s ease, color .15s ease, border-color .15s ease, opacity .15s ease;
  }
  .kebab-btn:hover,
  .kebab-btn:focus-visible,
  .kebab-btn.open{
    background:var(--canvas);
    color:var(--ink-soft);
    border-color:var(--gray-soft);
    opacity:1;
  }
  .kebab-menu{
    position:absolute;
    top:calc(100% + 6px);
    right:0;
    background:var(--card-bg);
    border:1px solid var(--border);
    border-radius:14px;
    box-shadow:0 12px 32px rgba(23,24,38,0.14);
    min-width:170px;
    padding:6px;
    z-index:20;
    display:none;
  }
  .kebab-menu.open{display:block;}
  .kebab-menu button{
    width:100%;
    display:flex;
    align-items:center;
    gap:8px;
    background:none;
    border:none;
    text-align:left;
    padding:10px 12px;
    border-radius:10px;
    font-size:13px;
    font-weight:700;
    font-family:inherit;
    color:var(--ink-soft);
    cursor:pointer;
  }
  .kebab-menu button:hover{background:var(--canvas);}
  .kebab-menu button.danger{color:#dc2626;}
  .kebab-menu button.danger:hover{background:var(--red-light);}

  /* ===== SELECT MODE (chọn nhiều để xóa) ===== */
  .sc-checkbox{
    display:none;
    flex-shrink:0;
    width:22px;height:22px;
    border-radius:7px;
    border:2px solid var(--border);
    background:var(--card-bg);
    cursor:pointer;
    position:relative;
    transition:background .15s ease, border-color .15s ease;
  }
  .select-mode .sc-checkbox{display:block;}
  .sc-checkbox.checked{background:linear-gradient(135deg,var(--pink),var(--violet));border-color:transparent;}
  .sc-checkbox.checked::after{
    content:"✓";
    position:absolute;inset:0;
    display:flex;align-items:center;justify-content:center;
    color:white;font-size:13px;font-weight:800;
  }
  .select-mode .sc-kebab-wrap{display:none;}
  .select-mode .student-card{cursor:pointer;}
  .student-card.is-checked{border-color:var(--pink);box-shadow:0 0 0 3px rgba(236,72,153,0.12);}

  .bulk-bar{
    position:fixed;
    left:50%;
    bottom:22px;
    transform:translateX(-50%) translateY(120%);
    opacity:0;
    background:var(--ink);
    color:white;
    border-radius:18px;
    padding:12px 14px 12px 20px;
    display:flex;
    align-items:center;
    gap:14px;
    box-shadow:0 16px 40px rgba(0,0,0,0.3);
    z-index:300;
    transition:transform .2s ease, opacity .2s ease;
    max-width:calc(100vw - 24px);
  }
  .bulk-bar.visible{transform:translateX(-50%) translateY(0);opacity:1;}
  .bulk-bar .bulk-count{font-size:13.5px;font-weight:700;white-space:nowrap;}
  .bulk-bar .btn.danger{
    background:linear-gradient(135deg,#ef4444,#dc2626);
    box-shadow:none;
  }
  .bulk-bar .btn.ghost-dark{
    background:rgba(255,255,255,0.1);
    color:white;
    border:1.5px solid rgba(255,255,255,0.18);
    box-shadow:none;
  }
  .bulk-bar .btn.ghost-dark:hover{background:rgba(255,255,255,0.18);}

  /* ===== RESULTS: CARD LIST ===== */
  .results-list{
    display:flex;
    flex-direction:column;
    gap:12px;
  }
  .student-card{
    background:var(--card-bg);
    border:1px solid var(--border);
    border-radius:20px;
    padding:18px 20px;
    display:flex;
    align-items:center;
    gap:18px;
    box-shadow:0 3px 14px rgba(23,24,38,0.04);
    transition:box-shadow .15s ease, transform .15s ease, border-color .15s ease;
  }
  .student-card:hover{
    box-shadow:0 10px 28px rgba(23,24,38,0.09);
    transform:translateY(-1px);
    border-color:#e3e6ef;
  }

  .sc-avatar{
    flex-shrink:0;
    width:46px;height:46px;
    border-radius:14px;
    background:linear-gradient(135deg,var(--pink),var(--violet));
    color:white;
    display:flex;align-items:center;justify-content:center;
    font-size:16px;
    font-weight:800;
    letter-spacing:0.02em;
  }

  .sc-main{flex:1 1 auto;min-width:0;}
  .sc-row-1{
    display:flex;
    align-items:center;
    margin-bottom:4px;
  }
  .sc-row-2{
    display:flex;
    align-items:center;
    gap:8px;
    flex-wrap:wrap;
    margin-bottom:6px;
  }
  .sc-name{font-size:15.5px;font-weight:800;color:var(--ink);}
  .ws-chip{
    display:inline-flex;
    align-items:center;
    gap:4px;
    background:var(--violet-light);
    color:var(--violet);
    border-radius:20px;
    padding:3px 10px;
    font-size:11.5px;
    font-weight:700;
    white-space:nowrap;
  }
  .sc-time{
    font-size:12px;
    color:var(--gray-soft);
    white-space:nowrap;
  }

  .sc-chips{display:flex;flex-wrap:wrap;gap:6px;}
  .topic-chip{
    display:inline-flex;
    align-items:center;
    gap:4px;
    background:var(--canvas);
    border:1px solid var(--border);
    color:var(--ink-soft);
    border-radius:10px;
    padding:4px 9px;
    font-size:11.5px;
    font-weight:700;
    white-space:nowrap;
  }
  .topic-chip .frac{color:var(--gray-soft);font-weight:600;}
  .topic-chip.zero{opacity:0.55;}
  .topic-chip.full{background:var(--green-light);border-color:transparent;color:#067a55;}
  .topic-chip.full .frac{color:#067a55;}

  .sc-score{
    flex-shrink:0;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:2px;
    min-width:76px;
  }
  .sc-score-ring{
    width:58px;height:58px;
    border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    font-size:13.5px;
    font-weight:800;
    position:relative;
  }
  .sc-score-ring svg{position:absolute;top:0;left:0;width:100%;height:100%;transform:rotate(-90deg);}
  .sc-score-ring span{position:relative;z-index:1;}
  .sc-score-frac{font-size:11px;color:var(--gray-soft);font-weight:700;margin-top:2px;white-space:nowrap;}

  .sc-action{flex-shrink:0;}

  .empty-state{
    text-align:center;
    padding:60px 20px;
    color:var(--gray);
    background:var(--card-bg);
    border-radius:20px;
    border:1px solid var(--border);
  }
  .empty-state .big{font-size:42px;margin-bottom:12px;}
  .empty-state-text{font-size:14px;}

  /* ===== DETAIL MODAL ===== */
  .modal-overlay{
    position:fixed;inset:0;
    background:rgba(23,24,38,0.55);
    backdrop-filter:blur(2px);
    display:flex;align-items:center;justify-content:center;
    z-index:400;
    padding:16px;
  }
  .detail-card{
    background:var(--card-bg);
    border-radius:26px;
    max-width:760px;
    width:100%;
    max-height:88vh;
    display:flex;
    flex-direction:column;
    box-shadow:0 24px 70px rgba(0,0,0,0.35);
    position:relative;
    animation:modalPop .18s ease;
  }
  @keyframes modalPop{from{transform:scale(.96);opacity:0;}to{transform:scale(1);opacity:1;}}
  .modal-close{
    position:absolute;
    top:18px;right:18px;
    background:var(--canvas);
    color:var(--ink-soft);
    border:none;
    width:34px;height:34px;
    border-radius:50%;
    font-size:15px;
    font-weight:800;
    cursor:pointer;
    z-index:2;
  }
  .modal-close:hover{background:var(--pink-light);color:var(--pink-deep);}
  .detail-header{padding:28px 30px 16px;border-bottom:1px solid var(--border);}
  .detail-header h3{margin:0 0 4px;font-size:19px;font-weight:800;padding-right:40px;}
  .detail-header .detail-time{font-size:12.5px;color:var(--gray-soft);}
  .detail-total{
    display:inline-block;
    margin-top:10px;
    font-weight:800;
    font-size:13.5px;
    background:var(--canvas);
    padding:7px 14px;
    border-radius:12px;
  }
  .detail-tabs{
    display:flex;
    gap:6px;
    flex-wrap:wrap;
    padding:14px 24px;
    border-bottom:1px solid var(--border);
    flex-shrink:0;
  }
  .detail-tab-btn{
    background:var(--canvas);
    border:1px solid transparent;
    padding:8px 14px;
    border-radius:12px;
    font-size:12.5px;
    font-weight:700;
    color:var(--gray);
    cursor:pointer;
    font-family:inherit;
    transition:background .15s ease, color .15s ease;
  }
  .detail-tab-btn:hover{background:var(--pink-light);color:var(--pink-deep);}
  .detail-tab-btn.active{background:linear-gradient(135deg,var(--pink),var(--violet));color:white;}
  .detail-body{padding:22px 30px 30px;overflow-y:auto;}
  .detail-block{margin-bottom:24px;}
  .detail-block:last-child{margin-bottom:0;}
  .detail-block h4{margin:0 0 12px;font-size:14.5px;font-weight:800;}

  .detail-fib-list{display:flex;flex-direction:column;gap:8px;}
  .detail-fib-item{
    display:flex;
    align-items:center;
    gap:10px;
    background:var(--canvas);
    border-radius:13px;
    padding:11px 14px;
  }
  .detail-fib-item.is-correct{background:var(--green-light);}
  .detail-fib-item.is-wrong{background:var(--red-light);}
  .fib-index{
    flex-shrink:0;
    width:22px;height:22px;
    border-radius:50%;
    background:white;
    display:flex;align-items:center;justify-content:center;
    font-size:11px;font-weight:800;color:var(--gray);
  }
  .detail-fib-item div:nth-child(2){flex:1;min-width:0;}
  .fib-student{font-size:13.5px;font-weight:700;word-break:break-word;}
  .fib-key{font-size:12px;color:#b91c1c;margin-top:2px;}
  .fib-mark{font-size:16px;font-weight:800;flex-shrink:0;}
  .is-correct .fib-mark{color:var(--green);}
  .is-wrong .fib-mark{color:var(--red);}

  .detail-trans-list{display:flex;flex-direction:column;gap:10px;}
  .detail-trans-item{background:var(--blue-light);border-radius:13px;padding:12px 16px;}
  .trans-prompt{font-size:12.5px;color:var(--gray);margin-bottom:6px;}
  .trans-answer{font-size:14px;font-weight:700;word-break:break-word;}

  .detail-speaking{
    background:var(--amber-light);
    border-radius:13px;
    padding:16px;
    font-size:13.5px;
    white-space:pre-wrap;
    word-break:break-word;
    min-height:40px;
  }

  @media(max-width:640px){
    .wrap{padding:18px 12px 80px;}
    .header{padding:24px 20px;border-radius:20px;}
    .header h1{font-size:20px;}
    .header p{font-size:13px;}
    .stats-row{grid-template-columns:repeat(2,1fr);gap:10px;}
    .stat-card{padding:15px 14px;border-radius:16px;}
    .stat-num{font-size:20px;}

    .toolbar{flex-direction:column;align-items:stretch;gap:8px;}
    .search-field{flex:1 1 auto;width:100%;}
    .toolbar .select-row{display:flex;gap:8px;}
    .toolbar .select-row select{flex:1 1 0;min-width:0;font-size:13px;padding:11px 10px;}
    .toolbar-actions{display:flex;gap:8px;width:100%;}
    .toolbar-actions .btn{
      flex:1 1 0;
      min-width:0;
      width:auto;
      justify-content:center;
      padding:11px 8px;
      font-size:12.5px;
      white-space:nowrap;
    }

    .sc-checkbox{width:20px;height:20px;}
    .student-card{
      flex-wrap:wrap;
      padding:16px;
      border-radius:18px;
      gap:10px 12px;
    }
    .sc-avatar{width:40px;height:40px;font-size:14px;border-radius:12px;}
    .sc-name{font-size:14.5px;}
    .sc-main{flex-basis:calc(100% - 52px);order:1;min-width:0;}
    .select-mode .sc-main{flex-basis:calc(100% - 86px);}
    .sc-kebab-wrap{order:2;flex-shrink:0;}
    .sc-score{
      order:3;
      flex-direction:row;
      align-items:center;
      gap:10px;
      min-width:0;
      flex:1 1 auto;
    }
    .sc-score-ring{width:44px;height:44px;font-size:12px;flex-shrink:0;}
    .sc-action{order:4;flex:0 0 auto;margin-left:auto;}
    .sc-action .btn{width:auto;white-space:nowrap;}
    .select-mode .sc-action{display:none;}

    .bulk-bar{
      left:12px;right:12px;
      transform:translateY(120%);
      bottom:14px;
      max-width:none;
      flex-wrap:wrap;
      padding:12px 14px;
    }
    .bulk-bar.visible{transform:translateY(0);}
    .bulk-bar .bulk-count{flex:1 1 100%;}

    .gate-card{padding:30px 22px;}
    .detail-card{border-radius:20px;max-height:92vh;}
    .detail-header{padding:22px 20px 14px;}
    .detail-header h3{font-size:17px;padding-right:36px;}
    .detail-tabs{padding:10px 16px;}
    .detail-body{padding:18px 20px 24px;}
    .modal-overlay{padding:10px;}
  }
</style>
</head>
<body>

<!-- ===== GATE (Đăng nhập Giáo Viên) ===== -->
<div class="gate-overlay" id="gate-overlay">
  <div class="gate-card">
    <div class="gate-icon">🔒</div>
    <h2>Khu vực giáo viên</h2>
    <p>Đăng nhập bằng tài khoản quản trị để xem bài.</p>

    <input type="email" id="login-email" placeholder="Email đăng nhập" autocomplete="email">
    <input type="password" id="login-password" placeholder="Mật khẩu" autocomplete="current-password"
      onkeydown="if(event.key==='Enter') handleLogin()">

    <button class="btn" id="login-btn" onclick="handleLogin()">Đăng nhập</button>

    <div class="gate-error" id="gate-error" style="display:none"></div>
  </div>
</div>

<!-- ===== DASHBOARD ===== -->
<div class="wrap" id="dashboard" style="display:none">

  <div class="header">
    <div class="header-inner">
      <div class="header-top-row">
        <span class="badge">📊 GIÁO VIÊN</span>
        <button class="btn ghost header-logout-btn" onclick="handleLogout()">🚪 Đăng xuất</button>
      </div>
      <h1>Kết quả bài làm</h1>
      <p>Theo dõi bài nộp từ tất cả các phiếu bài tập (5 Topics, Sports Benefits...) — điểm điền từ, câu dịch và bài nói của từng học viên.</p>
    </div>
  </div>

  <div class="stats-row" id="stats-row"></div>

  <div class="toolbar">
    <div class="search-field">
      <input type="text" id="search-box" placeholder="Tìm theo tên học viên..." oninput="renderTable()">
    </div>
    <div class="select-row">
      <select id="filter-select" onchange="renderTable()">
        <option value="all">Tất cả bài tập</option>
        <option value="5-topics">📚 5 Topics</option>
        <option value="sports-benefits">🏆 Sports Benefits</option>
      </select>
      <select id="sort-select" onchange="renderTable()">
        <option value="newest">Mới nhất</option>
        <option value="score-desc">Điểm cao → thấp</option>
        <option value="score-asc">Điểm thấp → cao</option>
        <option value="name">Tên A → Z</option>
      </select>
    </div>
    <div class="toolbar-actions">
      <button class="btn ghost" onclick="loadSubmissions()">👁️ Xem kết quả</button>
    </div>
  </div>
  <div class="last-updated" id="last-updated-row">
    <span id="last-updated"></span>
    <a href="#" class="refresh-link" onclick="event.preventDefault(); loadSubmissions();">🔄 Làm mới</a>
  </div>

  <div class="empty-state" id="empty-state" style="display:none">
    <div class="big">📭</div>
    <div class="empty-state-text" id="empty-state-text">Chưa có bài nộp nào.</div>
  </div>

  <div class="results-list" id="results-list" style="display:none"></div>

</div>

<!-- ===== BULK DELETE BAR ===== -->
<div class="bulk-bar" id="bulk-bar">
  <span class="bulk-count" id="bulk-count">Đã chọn 0</span>
  <button class="btn ghost-dark sm" onclick="clearSelection()">Bỏ chọn</button>
  <button class="btn danger sm" onclick="confirmBulkDelete()">🗑️ Xóa</button>
</div>

<!-- ===== DETAIL MODAL ===== -->
<div class="modal-overlay" id="detail-modal" style="display:none" onclick="if(event.target===this) closeDetail()">
  <div class="detail-card">
    <button class="modal-close" onclick="closeDetail()">✕</button>
    <div class="detail-header">
      <h3 id="detail-name"></h3>
      <div class="detail-time" id="detail-time"></div>
      <div class="detail-total" id="detail-total"></div>
    </div>
    <div class="detail-tabs" id="detail-tabs"></div>
    <div class="detail-body" id="detail-body"></div>
  </div>
</div>

<script>
  // Cấu hình tài khoản giáo viên được phép truy cập
  const ALLOWED_EMAIL = "huonglan.workspace@gmail.com";

  const ALL_TOPICS = (window.WORKSHEET_TOPICS) || ["houses","food","firstjob","travel","shopping"];
  const TOPIC_META = {
    houses:   { label: "Dream House",   icon: "🏡" },
    food:     { label: "Favorite Food", icon: "🍜" },
    firstjob: { label: "First Job",     icon: "💼" },
    travel:   { label: "Travel",        icon: "✈️" },
    shopping: { label: "Shopping",      icon: "🛍️" }
  };

  // Nhận diện loại phiếu bài tập dựa trên payload.data.worksheet
  // (worksheet undefined => bài "5 Topics" cũ, vì đó là phiếu đầu tiên chưa gắn nhãn)
  const WORKSHEET_META = {
    "5-topics":         { label: "5 Topics",         icon: "📚" },
    "sports-benefits":  { label: "Sports Benefits",  icon: "🏆" }
  };
  function getWorksheetKey(s){
    return (s.data && s.data.worksheet) ? s.data.worksheet : "5-topics";
  }
  function getWorksheetMeta(key){
    return WORKSHEET_META[key] || { label: key, icon: "📄" };
  }

  let allSubmissions = [];
  let currentDetailIndex = null;
  let currentDetailTopic = ALL_TOPICS[0];
  let selectMode = false;
  let selectedIds = new Set();
  let openKebabId = null;

  function escapeHtml(str){
    const div = document.createElement("div");
    div.textContent = (str === null || str === undefined) ? "" : String(str);
    return div.innerHTML;
  }

  function scoreColor(pct){
    if(pct >= 80) return "#10b981";
    if(pct >= 50) return "#f59e0b";
    return "#ef4444";
  }

  function scoreColorSoft(pct){
    if(pct >= 80) return "#d1fae5";
    if(pct >= 50) return "#fef3c7";
    return "#fee2e2";
  }

  function formatTime(iso){
    const d = new Date(iso);
    return d.toLocaleString("vi-VN", { day:"2-digit", month:"2-digit", year:"numeric", hour:"2-digit", minute:"2-digit" });
  }

  function initials(name){
    const parts = (name || "?").trim().split(/\s+/);
    if(parts.length === 1) return parts[0].slice(0,2).toUpperCase();
    return (parts[0][0] + parts[parts.length-1][0]).toUpperCase();
  }

  // Vẽ vòng tròn tiến độ điểm số bằng SVG (stroke-dasharray)
  function scoreRingSvg(pct, color){
    const r = 25, c = 2 * Math.PI * r;
    const offset = c * (1 - pct / 100);
    return (
      '<svg width="58" height="58" viewBox="0 0 58 58">' +
        '<circle cx="29" cy="29" r="' + r + '" fill="none" stroke="#eef0f4" stroke-width="5"/>' +
        '<circle cx="29" cy="29" r="' + r + '" fill="none" stroke="' + color + '" stroke-width="5" ' +
          'stroke-linecap="round" stroke-dasharray="' + c + '" stroke-dashoffset="' + offset + '"/>' +
      '</svg>'
    );
  }

  // ===== XỬ LÝ ĐĂNG NHẬP & ĐĂNG XUẤT (SUPABASE AUTH) =====

  // 1. Kiểm tra session ngay khi load trang
  document.addEventListener("DOMContentLoaded", async () => {
    if(!window.supabaseClient) return;

    try {
      const { data: { session } } = await window.supabaseClient.auth.getSession();
      if (session && session.user && session.user.email === ALLOWED_EMAIL) {
        unlockDashboard();
      }
    } catch (err) {
      console.error("Lỗi lấy session:", err);
    }
  });

  // 2. Hàm xử lý nút Đăng nhập
  async function handleLogin() {
    const email = document.getElementById("login-email").value.trim();
    const password = document.getElementById("login-password").value;
    const errorEl = document.getElementById("gate-error");
    const btn = document.getElementById("login-btn");

    if (!email || !password) {
      errorEl.textContent = "Vui lòng nhập đầy đủ email và mật khẩu.";
      errorEl.style.display = "block";
      return;
    }

    // Chặn ngay lập tức nếu nhập sai email quy định
    if (email !== ALLOWED_EMAIL) {
      errorEl.textContent = "Tài khoản không có quyền truy cập.";
      errorEl.style.display = "block";
      return;
    }

    errorEl.style.display = "none";
    btn.textContent = "Đang đăng nhập...";
    btn.disabled = true;

    try {
      if(!window.supabaseClient) throw new Error("Chưa kết nối Supabase (kiểm tra file config.js).");

      const { data, error } = await window.supabaseClient.auth.signInWithPassword({
        email: email,
        password: password,
      });

      if (error) throw error;

      // Xác minh lại sau khi có phản hồi từ database
      if (data.user && data.user.email === ALLOWED_EMAIL) {
         unlockDashboard();
      } else {
         await window.supabaseClient.auth.signOut();
         throw new Error("Tài khoản này không có quyền truy cập trang quản trị.");
      }
    } catch (err) {
      errorEl.textContent = "Lỗi đăng nhập: " + (err.message === "Invalid login credentials" ? "Sai email hoặc mật khẩu." : err.message);
      errorEl.style.display = "block";
    } finally {
      btn.textContent = "Đăng nhập";
      btn.disabled = false;
    }
  }

  // 3. Hàm xử lý nút Đăng xuất
  async function handleLogout() {
    if(!window.supabaseClient) return;
    await window.supabaseClient.auth.signOut();
    location.reload(); // Tải lại trang để khóa giao diện
  }

  function unlockDashboard(){
    document.getElementById("gate-overlay").style.display = "none";
    document.getElementById("dashboard").style.display = "block";
    loadSubmissions();
  }

  // ===== LOAD DATA =====
  async function loadSubmissions(){
    document.getElementById("last-updated").textContent = "Đang tải...";
    try{
      if(!window.supabaseClient){
        throw new Error("missing-config");
      }
      const { data, error } = await window.supabaseClient
        .from("submissions")
        .select("*")
        .order("created_at", { ascending: false });
      if(error) throw error;

      allSubmissions = data || [];
      document.getElementById("last-updated").textContent =
        "Cập nhật lúc " + new Date().toLocaleTimeString("vi-VN");
      renderTable();
    }catch(e){
      console.error("Load submissions error:", e);
      document.getElementById("last-updated").textContent = "";
      document.getElementById("stats-row").innerHTML = "";
      document.getElementById("results-list").style.display = "none";
      const empty = document.getElementById("empty-state");
      empty.style.display = "block";
      document.getElementById("empty-state-text").textContent =
        (e && e.message === "missing-config")
          ? "Chưa cấu hình Supabase — mở file config.js và điền SUPABASE_URL / SUPABASE_ANON_KEY."
          : "Không tải được dữ liệu. Kiểm tra lại kết nối mạng hoặc cấu hình Supabase (bảng submissions, RLS).";
    }
  }

  // Tự động làm mới mỗi 30 giây để giáo viên xem bài nộp gần như theo thời gian thực
  setInterval(() => {
    if(document.getElementById("dashboard").style.display !== "none"){
      loadSubmissions();
    }
  }, 30000);

  // ===== STATS =====
  // rows: mảng bài nộp đã lọc (theo ô tìm kiếm + loại bài tập). Mặc định dùng toàn bộ.
  function renderStats(rows){
    const data = rows || allSubmissions;
    const total = data.length;
    const uniqueNames = new Set(data.map(s => (s.student_name || "").trim().toLowerCase())).size;
    const avgPercent = total ? Math.round(
      data.reduce((sum, s) => sum + (s.max_score ? s.total_score / s.max_score : 0), 0) / total * 100
    ) : 0;
    const best = data.reduce((max, s) => {
      const p = s.max_score ? s.total_score / s.max_score : 0;
      return p > max.p ? { p, name: s.student_name } : max;
    }, { p: -1, name: "—" });

    document.getElementById("stats-row").innerHTML =
      '<div class="stat-card"><div class="stat-icon">📥</div><div class="stat-num">' + total + '</div><div class="stat-label">Lượt nộp bài</div></div>' +
      '<div class="stat-card"><div class="stat-icon">🧑‍🎓</div><div class="stat-num">' + uniqueNames + '</div><div class="stat-label">Học viên</div></div>' +
      '<div class="stat-card"><div class="stat-icon">📈</div><div class="stat-num">' + avgPercent + '%</div><div class="stat-label">Điểm TB (điền từ)</div></div>' +
      '<div class="stat-card"><div class="stat-icon">🏆</div><div class="stat-num">' + (best.p >= 0 ? Math.round(best.p * 100) + '%' : '—') + '</div><div class="stat-label">Cao nhất' + (best.p >= 0 ? ' — ' + escapeHtml(best.name) : '') + '</div></div>';
  }

  // ===== TABLE (nay render dạng danh sách card) =====
  function renderTable(){
    const q = document.getElementById("search-box").value.trim().toLowerCase();
    const sortBy = document.getElementById("sort-select").value;
    const wsFilter = document.getElementById("filter-select").value;

    let rows = allSubmissions.filter(s => (s.student_name || "").toLowerCase().includes(q));
    if(wsFilter !== "all"){
      rows = rows.filter(s => getWorksheetKey(s) === wsFilter);
    }

    // Thống kê cập nhật theo bộ lọc hiện tại (tìm tên + loại bài tập), không phụ thuộc sắp xếp
    renderStats(rows);

    rows.sort((a, b) => {
      const pa = a.max_score ? a.total_score / a.max_score : 0;
      const pb = b.max_score ? b.total_score / b.max_score : 0;
      if(sortBy === "score-desc") return pb - pa;
      if(sortBy === "score-asc") return pa - pb;
      if(sortBy === "name") return (a.student_name || "").localeCompare(b.student_name || "", "vi");
      return new Date(b.created_at) - new Date(a.created_at);
    });

    const list = document.getElementById("results-list");
    const empty = document.getElementById("empty-state");

    if(!rows.length){
      list.style.display = "none";
      empty.style.display = "block";
      document.getElementById("empty-state-text").textContent =
        allSubmissions.length ? "Không tìm thấy học viên nào khớp." : "Chưa có bài nộp nào.";
      list.innerHTML = "";
      return;
    }
    empty.style.display = "none";
    list.style.display = "flex";

    list.innerHTML = rows.map(s => {
      const pct = s.max_score ? Math.round(s.total_score / s.max_score * 100) : 0;
      const color = scoreColor(pct);
      const wsKey = getWorksheetKey(s);
      const wsMeta = getWorksheetMeta(wsKey);
      let chips;
      if(wsKey === "5-topics"){
        const fib = (s.data && s.data.fib) || {};
        chips = ALL_TOPICS.map(t => {
          const d = fib[t] || { correct: 0, total: 0 };
          const meta = TOPIC_META[t] || { label: t, icon: "•" };
          const cls = d.total && d.correct === d.total ? "full" : (d.correct === 0 ? "zero" : "");
          return '<span class="topic-chip ' + cls + '" title="' + escapeHtml(meta.label) + '">' + meta.icon + ' <span class="frac">' + d.correct + '/' + d.total + '</span></span>';
        }).join("");
      } else {
        const fib = (s.data && s.data.fib) || { correct: 0, total: 0 };
        const cls = fib.total && fib.correct === fib.total ? "full" : (fib.correct === 0 ? "zero" : "");
        chips = '<span class="topic-chip ' + cls + '" title="Điền từ">✏️ <span class="frac">' + fib.correct + '/' + fib.total + '</span></span>';
      }
      const realIndex = allSubmissions.indexOf(s);
      const isChecked = selectedIds.has(s.id);
      return (
        '<div class="student-card' + (isChecked ? ' is-checked' : '') + '" data-id="' + escapeHtml(s.id) + '" onclick="handleCardClick(event, ' + realIndex + ')">' +
          '<div class="sc-checkbox' + (isChecked ? ' checked' : '') + '" onclick="event.stopPropagation(); toggleCardSelect(\'' + s.id + '\')"></div>' +
          '<div class="sc-avatar">' + escapeHtml(initials(s.student_name)) + '</div>' +
          '<div class="sc-main">' +
            '<div class="sc-row-1">' +
              '<span class="sc-name">' + escapeHtml(s.student_name) + '</span>' +
            '</div>' +
            '<div class="sc-row-2">' +
              '<span class="ws-chip">' + wsMeta.icon + ' ' + escapeHtml(wsMeta.label) + '</span>' +
              '<span class="sc-time">🕒 ' + formatTime(s.created_at) + '</span>' +
            '</div>' +
            '<div class="sc-chips">' + chips + '</div>' +
          '</div>' +
          '<div class="sc-score">' +
            '<div class="sc-score-ring" style="color:' + color + '">' + scoreRingSvg(pct, color) + '<span>' + pct + '%</span></div>' +
            '<div class="sc-score-frac">' + s.total_score + '/' + s.max_score + '</div>' +
          '</div>' +
          '<div class="sc-action"><button class="btn sm" onclick="event.stopPropagation(); openDetail(' + realIndex + ')">Xem chi tiết</button></div>' +
          '<div class="sc-kebab-wrap">' +
            '<button class="kebab-btn" id="kebab-btn-' + escapeHtml(s.id) + '" onclick="event.stopPropagation(); toggleKebab(\'' + s.id + '\')">⋮</button>' +
            '<div class="kebab-menu" id="kebab-' + escapeHtml(s.id) + '">' +
              '<button onclick="event.stopPropagation(); deleteFromKebab(\'' + s.id + '\')" class="danger">🗑️ Xóa bài này</button>' +
            '</div>' +
          '</div>' +
        '</div>'
      );
    }).join("");
  }

  // ===== KEBAB MENU (⋮) =====
  function toggleKebab(id){
    // Đóng kebab đang mở khác (nếu có) trước khi mở/đóng cái được bấm
    if(openKebabId && openKebabId !== id){
      const prevMenu = document.getElementById("kebab-" + openKebabId);
      const prevBtn = document.getElementById("kebab-btn-" + openKebabId);
      if(prevMenu) prevMenu.classList.remove("open");
      if(prevBtn) prevBtn.classList.remove("open");
    }
    const menu = document.getElementById("kebab-" + id);
    const btn = document.getElementById("kebab-btn-" + id);
    if(!menu) return;
    const willOpen = !menu.classList.contains("open");
    menu.classList.toggle("open", willOpen);
    if(btn) btn.classList.toggle("open", willOpen);
    openKebabId = willOpen ? id : null;
  }
  // Đóng kebab menu khi bấm ra ngoài
  document.addEventListener("click", (e) => {
    if(openKebabId && !e.target.closest(".sc-kebab-wrap")){
      const menu = document.getElementById("kebab-" + openKebabId);
      const btn = document.getElementById("kebab-btn-" + openKebabId);
      if(menu) menu.classList.remove("open");
      if(btn) btn.classList.remove("open");
      openKebabId = null;
    }
  });

  // Bấm "Xóa bài này" trong menu ⋯ → bật chế độ chọn và tick sẵn dòng đó,
  // để giáo viên có thể chọn thêm các dòng khác rồi xóa hàng loạt.
  function deleteFromKebab(id){
    const menu = document.getElementById("kebab-" + id);
    if(menu) menu.classList.remove("open");
    openKebabId = null;
    if(!selectMode) enterSelectMode();
    selectedIds.add(id);
    renderTable();
    updateBulkBar();
  }

  // ===== SELECT MODE (chọn nhiều để xóa) =====
  function enterSelectMode(){
    selectMode = true;
    document.body.classList.add("select-mode");
    updateBulkBar();
  }
  function exitSelectMode(){
    selectMode = false;
    selectedIds.clear();
    document.body.classList.remove("select-mode");
    updateBulkBar();
    renderTable();
  }
  function clearSelection(){
    exitSelectMode();
  }

  function toggleCardSelect(id){
    if(selectedIds.has(id)) selectedIds.delete(id);
    else selectedIds.add(id);
    renderTable();
    updateBulkBar();
  }

  // Khi ở chế độ chọn, bấm vào bất kỳ đâu trên card cũng tick/bỏ tick dòng đó
  // (ngoài trừ các nút hành động đã tự stopPropagation).
  function handleCardClick(evt, realIndex){
    if(selectMode){
      const s = allSubmissions[realIndex];
      toggleCardSelect(s.id);
      return;
    }
  }

  function updateBulkBar(){
    const bar = document.getElementById("bulk-bar");
    const count = selectedIds.size;
    document.getElementById("bulk-count").textContent = "Đã chọn " + count;
    bar.classList.toggle("visible", selectMode && count > 0);
  }

  async function confirmBulkDelete(){
    const count = selectedIds.size;
    if(!count) return;
    const ok = confirm(
      "Xóa " + count + " kết quả đã chọn?\n" +
      "Hành động này không thể hoàn tác."
    );
    if(!ok) return;

    const ids = Array.from(selectedIds);
    try{
      if(!window.supabaseClient) throw new Error("Chưa kết nối Supabase.");
      const { error } = await window.supabaseClient
        .from("submissions")
        .delete()
        .in("id", ids);
      if(error) throw error;

      allSubmissions = allSubmissions.filter(s => !selectedIds.has(s.id));
      exitSelectMode();
      renderTable();
    }catch(e){
      console.error("Delete submissions error:", e);
      alert("Không xóa được: " + (e && e.message ? e.message : "Lỗi không xác định."));
    }
  }

  // ===== DETAIL MODAL =====
  function openDetail(index){
    currentDetailIndex = index;
    const s = allSubmissions[index];
    const wsKey = getWorksheetKey(s);
    const pct = s.max_score ? Math.round(s.total_score / s.max_score * 100) : 0;

    document.getElementById("detail-name").textContent = s.student_name;
    document.getElementById("detail-time").textContent = "Nộp lúc " + formatTime(s.created_at);
    const totalEl = document.getElementById("detail-total");
    totalEl.textContent = "Tổng điền từ: " + s.total_score + "/" + s.max_score + " (" + pct + "%)";
    totalEl.style.color = scoreColor(pct);
    totalEl.style.background = scoreColorSoft(pct);

    const tabsEl = document.getElementById("detail-tabs");
    if(wsKey === "5-topics"){
      currentDetailTopic = ALL_TOPICS[0];
      tabsEl.style.display = "flex";
      tabsEl.innerHTML = ALL_TOPICS.map(t => {
        const meta = TOPIC_META[t] || { label: t, icon: "•" };
        return '<button class="detail-tab-btn' + (t === currentDetailTopic ? ' active' : '') + '" data-topic="' + t + '" onclick="switchDetailTopic(\'' + t + '\')">' + meta.icon + ' ' + escapeHtml(meta.label) + '</button>';
      }).join("");
    } else {
      currentDetailTopic = null;
      tabsEl.style.display = "none";
      tabsEl.innerHTML = "";
    }

    renderDetailBody();
    document.getElementById("detail-modal").style.display = "flex";
  }

  function switchDetailTopic(t){
    currentDetailTopic = t;
    document.querySelectorAll(".detail-tab-btn").forEach(b => {
      b.classList.toggle("active", b.dataset.topic === t);
    });
    renderDetailBody();
  }

  function renderDetailBody(){
    const s = allSubmissions[currentDetailIndex];
    const wsKey = getWorksheetKey(s);
    const d = (s && s.data) || {};

    let fib, translations, speaking;
    if(wsKey === "5-topics"){
      const t = currentDetailTopic;
      fib = (d.fib && d.fib[t]) || { items: [], correct: 0, total: 0 };
      translations = (d.translations && d.translations[t]) || [];
      speaking = (d.speaking && d.speaking[t]) || "";
    } else {
      // Phiếu dạng phẳng (ví dụ sports-benefits): fib là { correct, total, items },
      // translations là mảng [{prompt, answer}], speaking là chuỗi.
      fib = d.fib || { items: [], correct: 0, total: 0 };
      translations = d.translations || [];
      speaking = d.speaking || "";
    }

    let html = "";

    html += '<div class="detail-block"><h4>✏️ Điền từ — ' + fib.correct + '/' + fib.total + ' đúng</h4><div class="detail-fib-list">';
    if(fib.items.length){
      fib.items.forEach((it, i) => {
        html += (
          '<div class="detail-fib-item ' + (it.is_correct ? 'is-correct' : 'is-wrong') + '">' +
            '<span class="fib-index">' + (i + 1) + '</span>' +
            '<div>' +
              '<div class="fib-student">' + (it.student_answer ? escapeHtml(it.student_answer) : '<i>(bỏ trống)</i>') + '</div>' +
              (!it.is_correct ? '<div class="fib-key">Đáp án đúng: ' + escapeHtml(it.answer_key) + '</div>' : '') +
            '</div>' +
            '<span class="fib-mark">' + (it.is_correct ? '✓' : '✗') + '</span>' +
          '</div>'
        );
      });
    } else {
      html += '<div style="color:var(--gray);font-size:13px;">Không có dữ liệu.</div>';
    }
    html += '</div></div>';

    html += '<div class="detail-block"><h4>🔤 Dịch câu (Bước 02)</h4><div class="detail-trans-list">';
    if(translations.length){
      translations.forEach(tr => {
        html += (
          '<div class="detail-trans-item">' +
            '<div class="trans-prompt">' + escapeHtml(tr.prompt) + '</div>' +
            '<div class="trans-answer">' + (tr.answer ? escapeHtml(tr.answer) : '<i>(bỏ trống)</i>') + '</div>' +
          '</div>'
        );
      });
    } else {
      html += '<div style="color:var(--gray);font-size:13px;">Không có dữ liệu.</div>';
    }
    html += '</div></div>';

    html += (
      '<div class="detail-block"><h4>🗣️ Bài nói / dàn ý (Bước 04)</h4>' +
      '<div class="detail-speaking">' + (speaking ? escapeHtml(speaking) : '<i>(bỏ trống)</i>') + '</div></div>'
    );

    document.getElementById("detail-body").innerHTML = html;
  }

  function closeDetail(){
    document.getElementById("detail-modal").style.display = "none";
  }
</script>

</body>
</html>
